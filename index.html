<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToolNest Pro – Powerful Everyday Tools. One Professional Workspace</title>
    <meta
      name="description"
      content="ToolNest Pro brings privacy-conscious, client-side image compression, format converters, document tools, QR code studio, project management, and AI chat into one workspace."
    />
    <meta name="keywords" content="image compressor, format converter, QR code generator, document writer, project manager, smart calculator, password generator, text analyzer, developer utilities, client-side tools" />
    <meta name="author" content="ToolNest Pro Engineering" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://toolnest.pro/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ToolNest Pro" />
    <meta property="og:title" content="ToolNest Pro – Powerful Everyday Tools. One Professional Workspace" />
    <meta
      property="og:description"
      content="High-performance browser tools for image compression, conversion, QR codes, document writing, project management, and productivity. Zero mandatory cloud uploads."
    />
    <meta property="og:url" content="https://toolnest.pro/" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ToolNest Pro – Powerful Everyday Tools. One Professional Workspace" />
    <meta
      name="twitter:description"
      content="Client-side privacy-first productivity suite. Compress images, convert formats, generate QR codes, manage tasks, and write documents effortlessly."
    />

    <!-- Google Fonts: Plus Jakarta Sans for refined typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Schema.org WebApplication & Organization JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "ToolNest Pro",
          "url": "https://toolnest.pro",
          "description": "Comprehensive online productivity and utility platform featuring image compression, conversion, document editing, QR codes, and project management.",
          "applicationCategory": "ProductivityApplication",
          "operatingSystem": "Web Browser",
          "browserRequirements": "Requires JavaScript. Requires HTML5 Canvas.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "featureList": [
            "Lossless & lossy browser image compression",
            "JPEG, PNG, WebP image conversion",
            "Document format converter (Markdown, HTML, TXT, JSON, CSV)",
            "Scannable QR code generator with Wi-Fi, vCard, URL, and SMS support",
            "Document editor with export to PDF, HTML, and TXT",
            "Full project management dashboard with local storage persistence",
            "Secure client-side password generator using Web Crypto API",
            "Live text density and reading time analyzer",
            "Smart financial and unit calculator",
            "AI Chat studio with secure backend proxy support"
          ]
        },
        {
          "@type": "Organization",
          "name": "ToolNest Pro",
          "url": "https://toolnest.pro",
          "logo": "https://toolnest.pro/logo.png",
          "sameAs": []
        }
      ]
    }
    </script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased selection:bg-indigo-500 selection:text-white dark:bg-slate-950 dark:text-slate-100 font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
